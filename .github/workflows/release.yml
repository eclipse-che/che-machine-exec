name: Release Che Machine Exec
run-name: Release Che Machine Exec ${{ inputs.version }} on ${{ github.ref_name }}

permissions:
  contents: write

on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      version:
        description: 'The version that is going to be released. Should be in format 7.y.z'
        required: true
      noCommit:
        description: 'If true, will not commit the version bump changes'
        default: ''
      forceRecreateTags:
        description: If true, tags will be recreated. Use with caution
        required: false
        default: 'false'
jobs:
  build:
    name: Create Release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Display release parameters
        env:
          VERSION: ${{ inputs.version }}
          NO_COMMIT: ${{ inputs.noCommit }}
          FORCE_RECREATE_TAGS: ${{ inputs.forceRecreateTags }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          TRIGGERED_BY: ${{ github.actor }}
        run: |
          echo "=== Release Parameters ==="
          echo "Version: ${VERSION}"
          echo "No commit: ${NO_COMMIT}"
          echo "Force recreate tags: ${FORCE_RECREATE_TAGS}"
          echo "Branch: ${REF_NAME}"
          echo "Commit SHA: ${COMMIT_SHA}"
          echo "Triggered by: ${TRIGGERED_BY}"
          echo "=========================="

          # Validate version format
          [[ "${VERSION}" =~ ^7\.[0-9]+\.[0-9]+$ ]] || { echo "[ERROR] Invalid version: ${VERSION}"; exit 1; }

      - name: Check existing tags
        env:
          RECREATE_TAGS: ${{ inputs.forceRecreateTags }}
          VERSION: ${{ inputs.version }}
        run: |
          set +e
          EXISTING_TAG=$(git ls-remote --exit-code origin refs/tags/${VERSION})
          if [[ -n ${EXISTING_TAG} ]]; then
            if [[ ${RECREATE_TAGS} == "true" ]]; then
              echo "[INFO] Removing tag for ${VERSION} version. New tag will be recreated during release."
              git push origin :${VERSION}
            else
              echo "[ERROR] Cannot proceed with release - tag ${EXISTING_TAG} already exists."
              exit 1
            fi
          else
            echo "[INFO] No existing tags detected for ${VERSION}"
          fi
      - name: Login to quay.io
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
          registry: quay.io
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.CHE_BOT_GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          NO_COMMIT_INPUT: ${{ inputs.noCommit }}
        run: |
          git config --global user.name "Mykhailo Kuznietsov"
          git config --global user.email "mkuznets@redhat.com"
          git config --global pull.rebase true
          if [[ ${NO_COMMIT_INPUT} == "true" ]]; then
            NO_COMMIT="--no-commit"
          else
            NO_COMMIT=
          fi
          /bin/bash make-release.sh --version "${VERSION}" --trigger-release ${NO_COMMIT}
